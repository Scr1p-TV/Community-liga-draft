<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Final 6 Draft – OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: transparent;
      font-family: 'Inter', sans-serif;
      color: white;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    /* ════════════════════════════════
       TOP BAR
    ════════════════════════════════ */
    #topBar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 72px;
      background: linear-gradient(90deg, rgba(8,14,26,0.96) 0%, rgba(15,25,41,0.92) 70%, transparent 100%);
      border-bottom: 2px solid rgba(0,230,118,0.5);
      display: flex;
      align-items: center;
      padding: 0 30px;
      gap: 30px;
      z-index: 10;
    }

    .obs-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 38px;
      letter-spacing: 5px;
      color: white;
      flex-shrink: 0;
    }
    .obs-logo span { color: #00e676; }

    .obs-phase-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 3px;
      padding: 4px 14px;
      border-radius: 20px;
      flex-shrink: 0;
      background: rgba(0,230,118,0.2); color: #00e676; border: 1px solid rgba(0,230,118,0.4);
    }
    .obs-phase-badge.lobby { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.35); }
    .obs-phase-badge.done  { background: rgba(240,165,0,0.2);   color: #f0a500; border: 1px solid rgba(240,165,0,0.4); }

    #obsCurrentPick {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      line-height: 1.4;
    }
    #obsOnTheClock {
      font-size: 20px;
      font-weight: 700;
      color: #00e676;
    }

    .obs-timer-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #obsTimer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      color: white;
      min-width: 75px;
      text-align: right;
      transition: color 0.3s;
    }
    #obsTimer.urgent { color: #ef4444; animation: pulse 0.5s infinite alternate; }
    @keyframes pulse { from { opacity:1; } to { opacity:0.3; } }
    .obs-timer-label { font-size: 11px; font-weight: 600; letter-spacing: 2px; color: #64748b; text-transform: uppercase; }

    /* ════════════════════════════════
       BOTTOM TICKER
    ════════════════════════════════ */
    #bottomBar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 54px;
      background: linear-gradient(90deg, rgba(8,14,26,0.96) 0%, rgba(15,25,41,0.9) 100%);
      border-top: 2px solid rgba(0,230,118,0.35);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 10;
    }
    .ticker-label {
      flex-shrink: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: #00e676;
      padding: 0 20px;
      border-right: 1px solid rgba(255,255,255,0.12);
      height: 100%;
      display: flex;
      align-items: center;
    }
    #tickerTrack {
      display: flex;
      gap: 0;
      animation: tickerScroll 50s linear infinite;
      white-space: nowrap;
    }
    @keyframes tickerScroll { 0% { transform:translateX(0); } 100% { transform:translateX(-50%); } }
    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 28px;
      font-size: 14px;
      font-weight: 600;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .ticker-item .t-icon  { font-size: 13px; color: #00e676; }
    .ticker-item .t-team  { color: #94a3b8; }
    .ticker-item .t-arrow { color: #475569; }
    .ticker-item .t-player { color: white; }
    .ticker-item .t-cat { color: #f0a500; font-size: 11px; }

    /* ════════════════════════════════
       RESULTS PANEL — right side
       (endet oberhalb des Webcam-Slots)
    ════════════════════════════════ */
    #resultsPanel {
      position: absolute;
      top: 82px;
      right: 24px;
      width: 460px;
      bottom: 305px;
      background: rgba(8,14,26,0.88);
      border: 1px solid rgba(0,230,118,0.25);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      overflow-y: auto;
      padding: 16px;
      z-index: 5;
    }
    .results-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: #00e676;
      border-bottom: 1px solid rgba(0,230,118,0.2);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .team-block {
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      overflow: hidden;
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }

    .team-header {
      background: rgba(255,255,255,0.05);
      padding: 8px 12px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .team-header .team-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00e676;
      flex-shrink: 0;
    }

    /* Fortschritt pro Kategorie statt vollständiger Pick-Liste (bei 24 Runden zu viel) */
    .cat-progress {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .cat-pill {
      flex: 1;
      text-align: center;
      border-radius: 8px;
      padding: 4px 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #64748b;
    }
    .cat-pill.complete { background: rgba(0,230,118,0.12); border-color: rgba(0,230,118,0.35); color: #00e676; }
    .cat-pill .cat-num { display:block; font-family:'Bebas Neue',sans-serif; font-size:16px; color:inherit; }

    .team-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      font-size: 13px;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(0,230,118,0.04);
    }
    .team-row .row-icon  { font-size: 13px; width: 18px; flex-shrink: 0; }
    .team-row .row-type  { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; width: 58px; flex-shrink: 0; color: #00e676; }
    .team-row .row-player { font-weight: 600; flex: 1; }
    .team-row.empty .row-player { color: #475569; font-style: italic; }

    /* ════════════════════════════════
       RECENT PICKS — left side
    ════════════════════════════════ */
    #recentPanel {
      position: absolute;
      top: 82px;
      left: 24px;
      width: 300px;
      bottom: 64px;
      background: rgba(8,14,26,0.82);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      overflow-y: auto;
      z-index: 5;
    }
    .recent-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: #64748b;
      padding: 12px 16px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky; top: 0;
      background: rgba(8,14,26,0.95);
    }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      animation: slideIn 0.4s ease;
    }
    .recent-icon { font-size: 14px; flex-shrink: 0; }
    .recent-info { flex: 1; }
    .recent-player { font-weight: 700; font-size: 14px; }
    .recent-team   { font-size: 11px; color: #64748b; margin-top: 1px; }
    .recent-type   { font-family: 'Bebas Neue', sans-serif; font-size: 15px; flex-shrink: 0; color: #00e676; text-align:right; }
    .recent-cat    { font-size: 9px; color: #f0a500; text-transform: uppercase; letter-spacing: .5px; }

    /* ════════════════════════════════
       WEBCAM SLOT — fester Platz, unten rechts
       (Kamera-Quelle in OBS einfach über diesen Rahmen legen)
    ════════════════════════════════ */
    #webcamSlot {
      position: absolute;
      bottom: 64px;
      right: 24px;
      width: 460px;
      height: 225px;
      border: 2px dashed rgba(0,230,118,0.5);
      border-radius: 14px;
      background: rgba(8,14,26,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      pointer-events: none;
    }
    #webcamSlot span {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 4px;
      font-size: 18px;
      color: rgba(0,230,118,0.5);
    }

    /* ════════════════════════════════
       PICK FLASH
    ════════════════════════════════ */
    #pickFlash {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, #080e1a 0%, #0f1929 100%);
      border: 3px solid #00e676;
      border-radius: 20px;
      padding: 44px 70px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 0 100px rgba(0,230,118,0.35);
      z-index: 20;
    }
    #pickFlash.active { opacity:1; transform:translate(-50%,-50%) scale(1); }

    .flash-badge  { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:5px; color:#00e676; margin-bottom:6px; }
    .flash-cat    { font-size:13px; color:#f0a500; font-weight:700; letter-spacing:2px; margin-bottom:10px; text-transform:uppercase; }
    .flash-team   { font-size:17px; color:#94a3b8; font-weight:600; margin-bottom:6px; }
    .flash-player { font-family:'Bebas Neue',sans-serif; font-size:70px; letter-spacing:2px; color:white; line-height:1; }

    #audioActivate {
      position: absolute;
      bottom: 300px; left: 24px;
      z-index: 50;
    }
    #audioActivate button {
      background: rgba(0,230,118,0.15);
      border: 1px solid rgba(0,230,118,0.4);
      color: #00e676;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #audioActivate button:hover { background: rgba(0,230,118,0.3); }
    #audioActivate.hidden { display: none; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div id="topBar">
    <div class="obs-logo">FINAL<span>6</span></div>
    <div id="obsPhaseBadge" class="obs-phase-badge lobby">LOBBY</div>
    <div>
      <div id="obsCurrentPick">Runde <span id="obsRound">—</span>/24 &middot; Pick <span id="obsPickNum">—</span>/144</div>
      <div id="obsOnTheClock">On the Clock: <span id="obsTeam">—</span></div>
    </div>
    <div class="obs-timer-wrap">
      <div id="obsTimer">—</div>
      <div class="obs-timer-label">Sek.</div>
    </div>
  </div>

  <!-- RECENT PICKS LEFT -->
  <div id="recentPanel">
    <div class="recent-title">ZULETZT</div>
    <div id="recentItems"></div>
  </div>

  <!-- RESULTS PANEL RIGHT -->
  <div id="resultsPanel">
    <div class="results-title">TEAM ÜBERSICHT</div>
    <div id="teamBlocks"></div>
  </div>

  <!-- WEBCAM SLOT — hier in OBS die Kamera-Quelle platzieren -->
  <div id="webcamSlot"><span>WEBCAM</span></div>

  <!-- BOTTOM TICKER -->
  <div id="bottomBar">
    <div class="ticker-label">LIVE</div>
    <div id="tickerTrack"></div>
  </div>

  <!-- AUDIO ACTIVATE BUTTON (click once in OBS to enable speech) -->
  <div id="audioActivate">
    <button onclick="activateAudio()">🔊 Audio aktivieren</button>
  </div>

  <!-- PLAYER CARD POPUP (shown after each draft pick) -->
  <div id="obsCardPopup" style="
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.8);
    opacity:0;
    pointer-events:none;
    transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);

  ">

      height:650px;
      border-radius:34px;
      overflow:hidden;

    ">
      <div style="
        position:absolute;inset:-40%;
        background:radial-gradient(circle,rgba(0,230,118,.2),transparent 70%);
        animation:spin 10s linear infinite;z-index:0;

      <div style="
        position:absolute;inset:0;
        background:linear-gradient(135deg,transparent 20%,rgba(0,230,118,.1) 50%,transparent 80%);

      "></div>
      <img id="obsCardLiga" src="" style="
        position:absolute;top:18px;left:50%;
        transform:translateX(-50%);

        object-fit:contain;
      " onerror="this.style.display='none'"/>
      <img id="obsCardPlayer" src="" style="
        position:absolute;bottom:155px;left:50%;
        transform:translateX(-50%);
        width:320px;z-index:4;
        object-fit:contain;
        filter:drop-shadow(0 0 16px rgba(0,230,118,.3));
      " onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMzIwIiBmaWxsPSJub25lIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0ic2ciIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0icmdiYSgwLDE2MCwyNTUsMC4yNSkiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSJyZ2JhKDAsODAsMTgwLDAuMDgpIi8+CiAgICA8L2xpbmVhckdyYWRpZW50PgogIDwvZGVmcz4KICA8IS0tIGJvZHkgLS0+CiAgPGVsbGlwc2UgY3g9IjEwMCIgY3k9IjgwIiByeD0iMzgiIHJ5PSI0NCIgZmlsbD0idXJsKCNzZykiIG9wYWNpdHk9IjAuOSIvPgogIDxwYXRoIGQ9Ik0zMCAzMjAgQzMwIDIyMCAxNzAgMjIwIDE3MCAzMjBaIiBmaWxsPSJ1cmwoI3NnKSIgb3BhY2l0eT0iMC45Ii8+CiAgPCEtLSBqZXJzZXkgbnVtYmVyIGFyZWEgLS0+CiAgPGVsbGlwc2UgY3g9IjEwMCIgY3k9IjE5NSIgcng9IjQyIiByeT0iMjgiIGZpbGw9InJnYmEoMCwxNDAsMjU1LDAuMDgpIi8+Cjwvc3ZnPg=='"/>
      <div style="
        position:absolute;bottom:145px;left:0;right:0;height:60px;
        background:linear-gradient(to bottom,transparent,rgba(6,15,28,.95));
        z-index:5;
      "></div>
      <div style="
        position:absolute;bottom:0;width:100%;
        padding:16px 16px 20px;z-index:6;
        background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.05));
        backdrop-filter:blur(10px);
      ">
        <div id="obsCardName" style="
          font-family:'Bebas Neue',sans-serif;
          font-size:44px;letter-spacing:4px;
          color:#fff;text-align:center;
          margin-bottom:12px;line-height:1;
          text-shadow:0 0 20px rgba(0,230,118,.4);
        ">NAME</div>
        <div style="display:flex;gap:10px;">
          <div style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;text-align:center;">
            <img id="obsCardNation" src="" style="width:46px;height:46px;object-fit:contain;margin-bottom:6px;display:block;margin-left:auto;margin-right:auto;" onerror="this.style.opacity='.3'"/>
            <span id="obsCardNationText" style="display:block;color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;"></span>
          </div>
          <div style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;text-align:center;">
            <img id="obsCardLigaFlag" src="" style="width:46px;height:46px;object-fit:contain;margin-bottom:6px;display:block;margin-left:auto;margin-right:auto;" onerror="this.style.opacity='.3'"/>
            <span id="obsCardLigaText" style="display:block;color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;"></span>
          </div>
          <div style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 6px;text-align:center;">
            <div id="obsCardPos" style="width:46px;height:46px;background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:24px;color:#00e676;margin:0 auto 6px;">?</div>

  <!-- PICK FLASH -->
  <div id="pickFlash">
    <div class="flash-badge" id="flashBadge">PICK 1</div>
    <div class="flash-cat" id="flashCat">STARTELF</div>
    <div class="flash-team"  id="flashTeam"></div>
    <div class="flash-player" id="flashPlayer"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { PLAYER_DATA } from "./players.js";

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const ROOT = "final6"; // gleicher Zweig wie in app.js — separat vom alten Draft-Tool

    const NUM_TEAMS = 6;
    const STARTELF_ROUNDS = 11, RESERVE_ROUNDS = 7, BACKUP_ROUNDS = 6;

    // ── Nation/Liga code maps ──
    const NATION_CODE = {
      "Frankreich":"fr","England":"gb-eng","Spanien":"es","Deutschland":"de",
      "Brasilien":"br","Argentinien":"ar","Portugal":"pt","Niederlande":"nl",
      "Belgien":"be","Norwegen":"no","Polen":"pl","Kroatien":"hr",
      "Dänemark":"dk","Uruguay":"uy","Kolumbien":"co","Schweiz":"ch",
      "Österreich":"at","Türkei":"tr","Ungarn":"hu","Schottland":"gb-sct",
      "Ägypten":"eg","Marokko":"ma","Senegal":"sn","Nigeria":"ng",
      "Kamerun":"cm","Ghana":"gh","Elfenbeinküste":"ci","Georgien":"ge",
      "Südkorea":"kr","Japan":"jp","USA":"us","Kanada":"ca","Ecuador":"ec",
      "Guinea":"gn","Serbien":"rs","Slowenien":"si","Slowakei":"sk",
      "Ukraine":"ua","Italien":"it","Mexiko":"mx","Armenien":"am",
    };
    const LIGA_FLAG = {
      "England 1":"gb-eng","England 2":"gb-eng",
      "Spanien 1":"es","Spanien 2":"es",
      "Italien 1":"it","Italien 2":"it",
      "Niederlande 1":"nl","Portugal 1":"pt",
      "Österreich 1":"at","Belgien 1":"be",
      "Frankreich 1":"fr","Polen 1":"pl","Schweiz 1":"ch",
      "Rest der Welt":"un",
    };

    function categoryForRound(round) {
      if (round <= STARTELF_ROUNDS) return "Startelf";
      if (round <= STARTELF_ROUNDS + RESERVE_ROUNDS) return "Reserve";
      return "Backup";
    }

    // ── Show player card popup ──
    function showObsCard(playerName) {
      const data  = PLAYER_DATA ? PLAYER_DATA[playerName] : null;
      const popup = document.getElementById("obsCardPopup");
      document.getElementById("obsCardName").textContent = playerName.toUpperCase();

      if (data) {
        var obsImg = document.getElementById("obsCardPlayer");
        obsImg.src = (data.imgUrl && data.imgUrl.trim() !== "") ? data.imgUrl :
          "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMzIwIiBmaWxsPSJub25lIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0ic2ciIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0icmdiYSgwLDE2MCwyNTUsMC4yNSkiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSJyZ2JhKDAsODAsMTgwLDAuMDgpIi8+CiAgICA8L2xpbmVhckdyYWRpZW50PgogIDwvZGVmcz4KICA8IS0tIGJvZHkgLS0+CiAgPGVsbGlwc2UgY3g9IjEwMCIgY3k9IjgwIiByeD0iMzgiIHJ5PSI0NCIgZmlsbD0idXJsKCNzZykiIG9wYWNpdHk9IjAuOSIvPgogIDxwYXRoIGQ9Ik0zMCAzMjAgQzMwIDIyMCAxNzAgMjIwIDE3MCAzMjBaIiBmaWxsPSJ1cmwoI3NnKSIgb3BhY2l0eT0iMC45Ii8+CiAgPCEtLSBqZXJzZXkgbnVtYmVyIGFyZWEgLS0+CiAgPGVsbGlwc2UgY3g9IjEwMCIgY3k9IjE5NSIgcng9IjQyIiByeT0iMjgiIGZpbGw9InJnYmEoMCwxNDAsMjU1LDAuMDgpIi8+Cjwvc3ZnPg==";
        const nCode = NATION_CODE[data.nation] || "un";
        document.getElementById("obsCardNation").src     = "https://flagcdn.com/w80/" + nCode + ".png";
        document.getElementById("obsCardNationText").textContent = data.nation.toUpperCase();
        const lCode = LIGA_FLAG[data.liga] || "un";
        document.getElementById("obsCardLigaFlag").src   = "https://flagcdn.com/w80/" + lCode + ".png";
        document.getElementById("obsCardLigaText").textContent  = data.liga.toUpperCase();
        document.getElementById("obsCardPos").textContent = data.pos;
        document.getElementById("obsCardLiga").src =
          "https://upload.wikimedia.org/wikipedia/de/thumb/0/04/UFL_video_game_logo.png/240px-UFL_video_game_logo.png";
      } else {
        document.getElementById("obsCardNation").src = "";
        document.getElementById("obsCardNationText").textContent = "";
        document.getElementById("obsCardLigaFlag").src = "";
        document.getElementById("obsCardLigaText").textContent = "";
        document.getElementById("obsCardPos").textContent = "?";
        document.getElementById("obsCardLiga").src = "";
      }

      popup.style.opacity = "1";
      popup.style.transform = "translate(-50%,-50%) scale(1)";
      setTimeout(function() {
        popup.style.opacity = "0";
        popup.style.transform = "translate(-50%,-50%) scale(0.8)";
      }, 5000);
    }

    // ── State ──
    let teams      = [];
    let draftPicks = {};   // team -> [{player, category}]
    let allPicksFlat = [];

    const PHASE_LABELS = {
      lobby: { text: "LOBBY", cls: "lobby" },
      draft: { text: "DRAFT", cls: "" }
    };

    // ── Firebase: config ──
    onValue(ref(db, ROOT + "/config"), snap => {
      const c = snap.val();
      if (!c) return;
      teams = (c.teams || []).map(t => t.name);
      renderTeamBlocks();
    });

    // ── Firebase: state (timer, phase, on the clock) ──
    onValue(ref(db, ROOT + "/state"), snap => {
      const state = snap.val();
      if (!state) return;

      const phase = state.phase || "lobby";
      const pl    = PHASE_LABELS[phase] || PHASE_LABELS.draft;
      const badge = document.getElementById("obsPhaseBadge");

      const currentPick = state.currentPick;
      const totalPicks  = state.totalPicks || (NUM_TEAMS * (STARTELF_ROUNDS + RESERVE_ROUNDS + BACKUP_ROUNDS));

      if (phase === "draft" && currentPick > totalPicks) {
        badge.textContent = "FERTIG";
        badge.className = "obs-phase-badge done";
      } else if (phase === "draft") {
        const round = Math.ceil(currentPick / NUM_TEAMS);
        badge.textContent = categoryForRound(round).toUpperCase();
        badge.className = "obs-phase-badge";
      } else {
        badge.textContent = pl.text;
        badge.className = "obs-phase-badge " + pl.cls;
      }

      const t       = state.timerValue ?? "—";
      const timerEl = document.getElementById("obsTimer");
      timerEl.textContent = t;
      timerEl.classList.toggle("urgent", typeof t === "number" && t <= 10);

      if (phase === "draft" && currentPick) {
        const round = Math.ceil(currentPick / NUM_TEAMS);
        document.getElementById("obsRound").textContent   = Math.min(round, STARTELF_ROUNDS + RESERVE_ROUNDS + BACKUP_ROUNDS);
        document.getElementById("obsPickNum").textContent = Math.min(currentPick, totalPicks);
      } else {
        document.getElementById("obsRound").textContent   = "—";
        document.getElementById("obsPickNum").textContent = "—";
      }
      document.getElementById("obsTeam").textContent = (currentPick <= totalPicks) ? (state.onTheClock || "—") : "—";
    });

    // ── Firebase: picks ──
    let lastDraftCount = 0;
    onValue(ref(db, ROOT + "/picks"), snap => {
      const data = snap.val() || {};
      draftPicks = {};
      allPicksFlat = Object.values(data).sort((a, b) => a.pickNumber - b.pickNumber);

      allPicksFlat.forEach(p => {
        if (!draftPicks[p.team]) draftPicks[p.team] = [];
        draftPicks[p.team].push({ player: p.player, category: p.category });
      });

      if (allPicksFlat.length > lastDraftCount && lastDraftCount >= 0) {
        const newest = allPicksFlat[allPicksFlat.length - 1];
        if (newest) {
          showFlash("PICK " + newest.pickNumber, newest.category, newest.team, newest.player);
          setTimeout(function() { showObsCard(newest.player); }, 2800);
          const announcement =
            "Mit dem " + ordinal(newest.pickNumber) + " Pick, Kategorie " + newest.category + " — " +
            newest.team + " — " + newest.player;
          speak(announcement);
        }
      }
      lastDraftCount = allPicksFlat.length;

      renderTeamBlocks();
      renderRecent();
      rebuildTicker();
    });

    // ── TEAM BLOCKS (results panel) — Fortschritt statt voller Liste ──
    function renderTeamBlocks() {
      const el = document.getElementById("teamBlocks");
      if (!el || teams.length === 0) return;
      el.innerHTML = "";

      teams.forEach(team => {
        const block = document.createElement("div");
        block.className = "team-block";

        const header = document.createElement("div");
        header.className = "team-header";
        const dot = document.createElement("div"); dot.className = "team-dot";
        const nameEl = document.createElement("span"); nameEl.textContent = team;
        header.appendChild(dot); header.appendChild(nameEl);
        block.appendChild(header);

        const picks = draftPicks[team] || [];
        const counts = { Startelf: 0, Reserve: 0, Backup: 0 };
        picks.forEach(p => { if (counts[p.category] !== undefined) counts[p.category]++; });

        const progress = document.createElement("div");
        progress.className = "cat-progress";
        [["Startelf", STARTELF_ROUNDS], ["Reserve", RESERVE_ROUNDS], ["Backup", BACKUP_ROUNDS]].forEach(([cat, max]) => {
          const pill = document.createElement("div");
          pill.className = "cat-pill" + (counts[cat] >= max ? " complete" : "");
          pill.innerHTML = "<span class='cat-num'>" + counts[cat] + "/" + max + "</span>" + cat;
          progress.appendChild(pill);
        });
        block.appendChild(progress);

        const last = picks[picks.length - 1];
        const row = makeRow(last ? last.player : null);
        block.appendChild(row);

        el.appendChild(block);
      });
    }

    function makeRow(player) {
      const row = document.createElement("div");
      row.className = "team-row" + (player ? "" : " empty");
      const iconEl   = document.createElement("span"); iconEl.className = "row-icon";   iconEl.textContent = "🏆";
      const typeEl   = document.createElement("span"); typeEl.className = "row-type";   typeEl.textContent = "LETZTER";
      const playerEl = document.createElement("span"); playerEl.className = "row-player"; playerEl.textContent = player || "Noch kein Pick";
      row.appendChild(iconEl); row.appendChild(typeEl); row.appendChild(playerEl);
      return row;
    }

    // ── RECENT ITEMS ──
    function renderRecent() {
      const el = document.getElementById("recentItems");
      if (!el) return;
      const recent = allPicksFlat.slice(-10).reverse();
      el.innerHTML = "";
      recent.forEach(p => {
        const item = document.createElement("div"); item.className = "recent-item";
        const iconEl   = document.createElement("div"); iconEl.className = "recent-icon"; iconEl.textContent = "🏆";
        const infoEl   = document.createElement("div"); infoEl.className = "recent-info";
        const playerEl = document.createElement("div"); playerEl.className = "recent-player"; playerEl.textContent = p.player;
        const teamEl   = document.createElement("div"); teamEl.className = "recent-team"; teamEl.textContent = p.team;
        infoEl.appendChild(playerEl); infoEl.appendChild(teamEl);
        const typeEl = document.createElement("div"); typeEl.className = "recent-type";
        typeEl.innerHTML = "PICK " + p.pickNumber + "<div class='recent-cat'>" + p.category + "</div>";
        item.appendChild(iconEl); item.appendChild(infoEl); item.appendChild(typeEl);
        el.appendChild(item);
      });
    }

    // ── TICKER ──
    function rebuildTicker() {
      if (allPicksFlat.length === 0) {
        document.getElementById("tickerTrack").innerHTML =
          '<span class="ticker-item"><span class="t-player">Noch keine Picks...</span></span>';
        return;
      }
      const doubled = [...allPicksFlat, ...allPicksFlat];
      document.getElementById("tickerTrack").innerHTML = doubled.map(p =>
        `<span class="ticker-item">
          <span class="t-icon">🏆</span>
          <span class="t-team">${p.team}</span>
          <span class="t-arrow">→</span>
          <span class="t-player">${p.player}</span>
          <span class="t-cat">(${p.category})</span>
        </span>`
      ).join("");
    }

    // ── SPEECH via Google Translate Audio (funktioniert in OBS ohne installierte Stimmen) ──
    let speechQueue = [];
    let isSpeaking  = false;
    let audioCtx    = null;

    window.addEventListener("load", function() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        document.getElementById("audioActivate").classList.add("hidden");
        const buf = audioCtx.createBuffer(1, 1, 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start(0);
      } catch(e) { console.warn("AudioContext:", e); }
    });

    document.addEventListener("click", function() {
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      document.getElementById("audioActivate").classList.add("hidden");
    }, { once: true });

    window.activateAudio = function() {
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      document.getElementById("audioActivate").classList.add("hidden");
      speak("Audio aktiviert. Bereit für den Final 6 Draft.");
    };

    function speak(text) {
      speechQueue.push(text);
      processQueue();
    }

    function processQueue() {
      if (isSpeaking || speechQueue.length === 0) return;
      isSpeaking = true;
      const text = speechQueue.shift();
      const encoded = encodeURIComponent(text);
      const url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=de&client=tw-ob&q=" + encoded;

      const audio = new Audio(url);
      audio.volume = 1.0;

      audio.onended = function() { isSpeaking = false; setTimeout(processQueue, 300); };
      audio.onerror = function() {
        console.warn("TTS error, retrying with Web Speech API");
        if (window.speechSynthesis) {
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = "de-DE"; utt.rate = 0.88;
          utt.onend = utt.onerror = function() { isSpeaking = false; setTimeout(processQueue, 300); };
          window.speechSynthesis.speak(utt);
        } else {
          isSpeaking = false; setTimeout(processQueue, 300);
        }
      };
      audio.play().catch(function(e) {
        console.warn("Audio play failed:", e);
        isSpeaking = false; processQueue();
      });
    }

    function ordinal(n) {
      if (n === 1) return "ersten";
      if (n === 2) return "zweiten";
      if (n === 3) return "dritten";
      return n + "ten";
    }

    // ── PICK FLASH ──
    function showFlash(badge, category, team, player) {
      const el = document.getElementById("pickFlash");
      document.getElementById("flashBadge").textContent  = badge;
      document.getElementById("flashCat").textContent    = category;
      document.getElementById("flashTeam").textContent   = team;
      document.getElementById("flashPlayer").textContent = player;
      el.classList.add("active");
      setTimeout(() => { el.classList.remove("active"); }, 2500);
    }
  </script>
</body>
